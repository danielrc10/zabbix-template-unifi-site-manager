    tags:
    - tag: class
      value: network
    - tag: component
      value: snmp-extension
    - tag: target
      value: unifi-device
    macros:
    - macro: "{$UNIFI.SNMP.INTERVAL}"
      value: 2m
      description: Optional local SNMP telemetry interval.
    - macro: "{$UNIFI.SNMP.INVENTORY.INTERVAL}"
      value: 6h
      description: Static UI-MIB system information interval.
    - macro: "{$UNIFI.SNMP.DISCOVERY.INTERVAL}"
      value: 6h
      description: Interface, radio and VAP discovery interval.
    - macro: "{$UNIFI.SNMP.TIMEOUT}"
      value: 5m
      description: SNMP-unavailable alarm window.
    - macro: "{$UNIFI.SNMP.IFNAME.MATCHES}"
      value: ".*"
      description: Interface names included by discovery.
    - macro: "{$UNIFI.SNMP.IFNAME.NOT_MATCHES}"
      value: "^(lo|loopback|sit[0-9]*|ip6tnl[0-9]*)$"
      description: Interface names excluded by discovery.
    - macro: "{$UNIFI.SNMP.IFCONTROL}"
      value: '0'
      description: Default interface-down alarm control. Set context macros to 1 only
        for critical interfaces.
    - macro: "{$UNIFI.SNMP.RADIO.UTIL.WARN}"
      value: '80'
      description: High total channel utilization threshold in percent.
    - macro: "{$UNIFI.SNMP.RADIO.INTERFERENCE.WARN}"
      value: '70'
      description: High other-BSS utilization threshold in percent.
    - macro: "{$UNIFI.SNMP.CCQ.WARN}"
      value: '70'
      description: Low client connection quality threshold in percent.
    valuemaps:
    - uuid: 83714d560a7f4f8a84c50a9ab40c8d6f
      name: Boolean
      mappings:
      - value: '0'
        newvalue: 'No'
      - value: '1'
        newvalue: 'Yes'
    - uuid: 0c8b9778d6e549e882664bb29e91dfdf
      name: Zabbix host availability
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
