        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var payload = JSON.parse(value);
            var rows = Array.isArray(payload.nvrs) ? payload.nvrs : [];
            var nvr = null;
            for (var i = 0; i < rows.length; i++) {
                if (String(rows[i].host_id) === '{#HOST.ID}' && rows[i].nvr) {
