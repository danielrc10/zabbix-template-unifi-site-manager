        - uuid: dc58600c7a1f4ccd88763c4fb287a8fa
          expression: last(/Template UniFi Site Manager/unifi.camera.recording.mode[{#CAMERA.ID}],#1)<>last(/Template
            UniFi Site Manager/unifi.camera.recording.mode[{#CAMERA.ID}],#2)
