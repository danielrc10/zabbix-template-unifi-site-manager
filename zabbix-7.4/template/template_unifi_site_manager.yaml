    - uuid: fa70ea0f1c264ed58013805305204ace
      name: LLD - Subnets and DHCP pools
      type: DEPENDENT
      key: unifi.subnets.discovery
      lifetime_type: DELETE_AFTER
      lifetime: 7d
      enabled_lifetime_type: DISABLE_AFTER
      enabled_lifetime: 1d
      description: Discovers official Network objects and DHCP ranges. Utilization
        is estimated from connected client addresses, not from the unavailable DHCP
        lease table.
      item_prototypes:
      - uuid: 2b8fc93214dd42dc86066c9f6f81a215
        name: "[{#SUBNET.NAME}] DHCP: Connected clients source"
        type: CALCULATED
        key: unifi.subnet.clients.source[{#SITE.ID},{#SUBNET.ID}]
        delay: "{$UNIFI.INTERVAL.CAPACITY}"
        history: '0'
        trends: '0'
        value_type: TEXT
        params: last(//unifi.site.clients.raw[{#SITE.ID}])
        tags:
        - tag: component
          value: Raw
        - tag: site
          value: "{#SITE.NAME}"
        - tag: subnet
          value: "{#SUBNET.NAME}"
      - uuid: 737c9d8886d947568155c8cbedb8f42c
        name: "[{#SITE.NAME} / {#SUBNET.NAME}] DHCP: Connected-address utilization
          estimate"
        type: DEPENDENT
        key: unifi.subnet.dhcp.used.pct[{#SITE.ID},{#SUBNET.ID}]
        history: 30d
        value_type: FLOAT
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            function ipv4(value) {
                var parts = String(value).split('.');
                if (parts.length !== 4) return null;
                var result = 0;
                for (var i = 0; i < 4; i++) {
                    var part = Number(parts[i]);
                    if (part < 0 || part > 255 || Math.floor(part) !== part) return null;
                    result = result * 256 + part;
                }
                return result;
            }
            var start = ipv4('{#DHCP.START}');
            var stop = ipv4('{#DHCP.STOP}');
            if (start === null || stop === null || stop < start) throw 'DHCP range is unavailable.';
            var payload = JSON.parse(value);
            if (payload.code || Number(payload.httpStatusCode) >= 400) throw String(payload.message || payload.code);
            var clients = Array.isArray(payload.data) ? payload.data : [];
            var used = {};
            for (var i = 0; i < clients.length; i++) {
                var address = ipv4(clients[i].ipAddress);
                if (address !== null && address >= start && address <= stop) used[String(address)] = true;
            }
            return Object.keys(used).length * 100 / (stop - start + 1);
        master_item:
          key: unifi.subnet.clients.source[{#SITE.ID},{#SUBNET.ID}]
        tags:
        - tag: component
          value: DHCP
        - tag: site
          value: "{#SITE.NAME}"
        - tag: subnet
          value: "{#SUBNET.NAME}"
        trends: 365d
        units: "%"
        trigger_prototypes:
        - uuid: 26ea6db31781439e8728ccb3b161013d
          expression: last(/Template UniFi Site Manager/unifi.subnet.dhcp.used.pct[{#SITE.ID},{#SUBNET.ID}])>{$DHCP.THRESHOLD.PCT}
          name: "[Average] DHCP pool usage is high on {#SUBNET.NAME}"
          priority: AVERAGE
          description: Connected client IPs inside the configured pool exceed the
            threshold. This is an estimate, because the official API does not publish
            the DHCP lease table.
          tags:
          - tag: scope
            value: availability
          - tag: site
            value: "{#SITE.NAME}"
          - tag: subnet
            value: "{#SUBNET.NAME}"
          opdata: 'Estimated use: {ITEM.LASTVALUE1}; subnet: {#SUBNET.CIDR}'
      master_item:
        key: unifi.inventory.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var inventory = JSON.parse(value);
          var rows = inventory.subnets;
          if (!Array.isArray(rows)) throw 'Inventory section subnets is absent.';
          return JSON.stringify(rows);
      lld_macro_paths:
      - lld_macro: "{#SUBNET.ID}"
        path: "$.subnet_id"
      - lld_macro: "{#SUBNET.NAME}"
        path: "$.subnet_name"
      - lld_macro: "{#SUBNET.CIDR}"
        path: "$.subnet_cidr"
      - lld_macro: "{#DHCP.START}"
        path: "$.dhcp_start"
      - lld_macro: "{#DHCP.STOP}"
        path: "$.dhcp_stop"
      - lld_macro: "{#SITE.ID}"
        path: "$.site_id"
      - lld_macro: "{#SITE.NAME}"
        path: "$.site_name"
      - lld_macro: "{#HOST.ID}"
        path: "$.host_id"
    - uuid: e8f4ec4d44c14d7a8cac587b75c09b2a
      name: LLD - WiFi SSIDs
      type: DEPENDENT
      key: unifi.ssids.discovery
      lifetime_type: DELETE_AFTER
      lifetime: 7d
      enabled_lifetime_type: DISABLE_AFTER
      enabled_lifetime: 1d
      description: Discovers WiFi broadcasts/SSIDs. The current client-list contract
        does not attribute a client to an SSID, so per-SSID counts remain unsupported
        unless that field is present.
      item_prototypes:
      - uuid: 4db26e7965ea408e81b5f3a4b5ecb458
        name: "[{#SITE.NAME} / {#SSID.NAME}] WiFi: Connected clients source"
        type: CALCULATED
        key: unifi.ssid.clients.source[{#SITE.ID},{#SSID.ID}]
        delay: "{$UNIFI.INTERVAL.PERFORMANCE}"
        history: '0'
        trends: '0'
        value_type: TEXT
        params: last(//unifi.site.clients.raw[{#SITE.ID}])
        tags:
        - tag: component
          value: Raw
        - tag: site
          value: "{#SITE.NAME}"
        - tag: ssid
          value: "{#SSID.NAME}"
      - uuid: c6ce0739e9b64424863eeb4993a2e38c
        name: "[{#SITE.NAME} / {#SSID.NAME}] WiFi: Connected clients (when attributed)"
        type: DEPENDENT
        key: unifi.ssid.clients[{#SITE.ID},{#SSID.ID}]
        history: 30d
        value_type: UNSIGNED
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var payload = JSON.parse(value);
            if (payload.code || Number(payload.httpStatusCode) >= 400) throw String(payload.message || payload.code);
            var clients = Array.isArray(payload.data) ? payload.data : [];
            var count = 0;
            var attributionSeen = false;
            for (var i = 0; i < clients.length; i++) {
                if (String(clients[i].type).toUpperCase() !== 'WIRELESS') continue;
                var id = clients[i].wifiBroadcastId || clients[i].ssidId || (clients[i].wifi && clients[i].wifi.broadcastId);
                var name = clients[i].ssid || (clients[i].wifi && clients[i].wifi.ssid);
                if (typeof id !== 'undefined' || typeof name !== 'undefined') attributionSeen = true;
                if (String(id || '') === '{#SSID.ID}' || String(name || '') === '{#SSID.NAME}') count++;
            }
            if (!attributionSeen && clients.length) throw 'The official client list does not attribute clients to an SSID.';
            return count;
        master_item:
          key: unifi.ssid.clients.source[{#SITE.ID},{#SSID.ID}]
        tags:
        - tag: component
          value: WiFi
        - tag: site
          value: "{#SITE.NAME}"
        - tag: ssid
          value: "{#SSID.NAME}"
        trends: 365d
      master_item:
        key: unifi.inventory.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var inventory = JSON.parse(value);
          var rows = inventory.ssids;
          if (!Array.isArray(rows)) throw 'Inventory section ssids is absent.';
          return JSON.stringify(rows);
      lld_macro_paths:
      - lld_macro: "{#SSID.ID}"
        path: "$.ssid_id"
      - lld_macro: "{#SSID.NAME}"
        path: "$.ssid_name"
      - lld_macro: "{#SITE.ID}"
        path: "$.site_id"
      - lld_macro: "{#SITE.NAME}"
        path: "$.site_name"
      - lld_macro: "{#HOST.ID}"
        path: "$.host_id"
    - uuid: 28c5a83e067f4683869c2c7cc381e3c5
      name: LLD - AP radios
      type: DEPENDENT
      key: unifi.ap.radios.discovery
      lifetime_type: DELETE_AFTER
      lifetime: 7d
      enabled_lifetime_type: DISABLE_AFTER
      enabled_lifetime: 1d
      description: Discovers 2.4/5/6/60 GHz radios. Official latest statistics currently
        guarantee frequencyGHz and txRetriesPct only.
      item_prototypes:
      - uuid: e2df07b8061a4633823ed896c043e59c
        name: "[{#AP.NAME} / {#RADIO.BAND}] Radio: Device statistics source"
        type: CALCULATED
        key: unifi.radio.stats.source[{#AP.MAC},{#RADIO.BAND}]
        delay: "{$UNIFI.INTERVAL.PERFORMANCE}"
        history: '0'
        trends: '0'
        value_type: TEXT
        params: last(//unifi.device.stats.raw[{#DEVICE.ID},{#SITE.ID}])
        tags:
        - tag: component
          value: Raw
        - tag: device
          value: "{#AP.NAME}"
        - tag: radio
          value: "{#RADIO.BAND}"
        - tag: site
          value: "{#SITE.NAME}"
      - uuid: bffd2863aaaa423a834ffcb0f5854b1e
        name: "[{#AP.NAME} / {#RADIO.BAND}] Radio: Client list source"
        type: CALCULATED
        key: unifi.radio.clients.source[{#AP.MAC},{#RADIO.BAND}]
        delay: "{$UNIFI.INTERVAL.PERFORMANCE}"
        history: '0'
        trends: '0'
        value_type: TEXT
        params: last(//unifi.site.clients.raw[{#SITE.ID}])
        tags:
        - tag: component
          value: Raw
        - tag: device
          value: "{#AP.NAME}"
        - tag: radio
          value: "{#RADIO.BAND}"
        - tag: site
          value: "{#SITE.NAME}"
      - uuid: cfb1db8190ee4e9c85271c437af4ae18
        name: "[{#AP.NAME} / {#RADIO.BAND}] Radio: TX retries"
        type: DEPENDENT
        key: unifi.radio.tx.retries[{#AP.MAC},{#RADIO.BAND}]
        history: 30d
        value_type: FLOAT
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var data = JSON.parse(value);
            if (data.code || Number(data.httpStatusCode) >= 400) throw String(data.message || data.code);
            var radios = data.interfaces && Array.isArray(data.interfaces.radios) ? data.interfaces.radios : [];
            var radio = null;
            for (var i = 0; i < radios.length; i++) if (String(radios[i].frequencyGHz) === '{#RADIO.FREQUENCY}') { radio = radios[i]; break; }
            if (!radio) throw 'Radio statistics were not found.';
            if (typeof radio.txRetriesPct === 'undefined') throw 'TX retries are absent.';
            return Number(radio.txRetriesPct);
        master_item:
          key: unifi.radio.stats.source[{#AP.MAC},{#RADIO.BAND}]
        tags:
        - tag: component
          value: WiFi
        - tag: device
          value: "{#AP.NAME}"
        - tag: radio
          value: "{#RADIO.BAND}"
        - tag: site
          value: "{#SITE.NAME}"
        trends: 365d
        units: "%"
        trigger_prototypes:
        - uuid: 410dce2d60434cf881c0d34da385059f
          expression: avg(/Template UniFi Site Manager/unifi.radio.tx.retries[{#AP.MAC},{#RADIO.BAND}],10m)>{$WIFI.TX.RETRIES.WARN}
          name: "[Average] High WiFi TX retries on {#AP.NAME} / {#RADIO.BAND}"
          priority: AVERAGE
          description: The ten-minute average retry percentage exceeds the configured
            threshold.
          tags:
          - tag: scope
            value: availability
          - tag: device
            value: "{#AP.NAME}"
          - tag: radio
            value: "{#RADIO.BAND}"
          - tag: site
            value: "{#SITE.NAME}"
          opdata: 'TX retries: {ITEM.LASTVALUE1}'
      - uuid: ec7f10e2b67542bd87bb3ef9b53c31c2
        name: "[{#AP.NAME} / {#RADIO.BAND}] Radio: Airtime utilization (when exposed)"
        type: DEPENDENT
        key: unifi.radio.airtime[{#AP.MAC},{#RADIO.BAND}]
        history: 30d
        value_type: FLOAT
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var data = JSON.parse(value);
            if (data.code || Number(data.httpStatusCode) >= 400) throw String(data.message || data.code);
            var radios = data.interfaces && Array.isArray(data.interfaces.radios) ? data.interfaces.radios : [];
            var radio = null;
            for (var i = 0; i < radios.length; i++) if (String(radios[i].frequencyGHz) === '{#RADIO.FREQUENCY}') { radio = radios[i]; break; }
            if (!radio) throw 'Radio statistics were not found.';
            var airtime = radio.airtimeUtilizationPct;
            if (typeof airtime === 'undefined') airtime = radio.channelUtilizationPct;
            if (typeof airtime === 'undefined') throw 'Airtime/channel utilization is not exposed by the current official radio statistics schema.';
            return Number(airtime);
        master_item:
          key: unifi.radio.stats.source[{#AP.MAC},{#RADIO.BAND}]
        tags:
        - tag: component
          value: WiFi
        - tag: device
          value: "{#AP.NAME}"
        - tag: radio
          value: "{#RADIO.BAND}"
        - tag: site
          value: "{#SITE.NAME}"
        trends: 365d
        units: "%"
        trigger_prototypes:
        - uuid: d4226ab1b443417686d3f87a0cfec8e9
          expression: avg(/Template UniFi Site Manager/unifi.radio.airtime[{#AP.MAC},{#RADIO.BAND}],10m)>80
          name: "[Average] High WiFi channel utilization on {#AP.NAME} / {#RADIO.BAND}"
          priority: AVERAGE
          description: Ten-minute average airtime/channel utilization exceeds 80%.
            No value is generated until the official API exposes this field.
          tags:
          - tag: scope
            value: availability
          - tag: device
            value: "{#AP.NAME}"
          - tag: radio
            value: "{#RADIO.BAND}"
          - tag: site
            value: "{#SITE.NAME}"
          opdata: 'Average/current utilization: {ITEM.LASTVALUE1}'
      - uuid: 6c5691afecaa4a008f8a9903831ede45
        name: "[{#AP.NAME} / {#RADIO.BAND}] Radio: WiFi experience (when exposed)"
        type: DEPENDENT
        key: unifi.radio.experience[{#AP.MAC},{#RADIO.BAND}]
        history: 30d
        value_type: FLOAT
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var data = JSON.parse(value);
            if (data.code || Number(data.httpStatusCode) >= 400) throw String(data.message || data.code);
            var radios = data.interfaces && Array.isArray(data.interfaces.radios) ? data.interfaces.radios : [];
            var radio = null;
            for (var i = 0; i < radios.length; i++) if (String(radios[i].frequencyGHz) === '{#RADIO.FREQUENCY}') { radio = radios[i]; break; }
            if (!radio) throw 'Radio statistics were not found.';
            var score = radio.wifiExperiencePct;
            if (typeof score === 'undefined') score = radio.experienceScore;
            if (typeof score === 'undefined') throw 'WiFi experience is not exposed by the current official radio statistics schema.';
            return Number(score);
        master_item:
          key: unifi.radio.stats.source[{#AP.MAC},{#RADIO.BAND}]
        tags:
        - tag: component
          value: WiFi
        - tag: device
          value: "{#AP.NAME}"
        - tag: radio
          value: "{#RADIO.BAND}"
        - tag: site
          value: "{#SITE.NAME}"
        trends: 365d
        units: "%"
      - uuid: e6251b29796343918501eca4a2ab3793
        name: "[{#AP.NAME} / {#RADIO.BAND}] Radio: Connected clients (when band is
          attributed)"
        type: DEPENDENT
        key: unifi.radio.clients[{#AP.MAC},{#RADIO.BAND}]
        history: 30d
        value_type: UNSIGNED
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var payload = JSON.parse(value);
            var clients = Array.isArray(payload.data) ? payload.data : [];
            var count = 0;
            var bandSeen = false;
            for (var i = 0; i < clients.length; i++) {
                if (String(clients[i].uplinkDeviceId) !== '{#DEVICE.ID}') continue;
                var band = clients[i].frequencyGHz || clients[i].radioBand || (clients[i].wifi && clients[i].wifi.frequencyGHz);
                if (typeof band !== 'undefined') bandSeen = true;
                if (String(band) === '{#RADIO.FREQUENCY}' || String(band) === '{#RADIO.BAND}') count++;
            }
            if (!bandSeen && clients.length) throw 'The official client list does not attribute clients to a radio band.';
            return count;
        master_item:
          key: unifi.radio.clients.source[{#AP.MAC},{#RADIO.BAND}]
        tags:
        - tag: component
          value: WiFi
        - tag: device
          value: "{#AP.NAME}"
        - tag: radio
          value: "{#RADIO.BAND}"
        - tag: site
          value: "{#SITE.NAME}"
        trends: 365d
      master_item:
        key: unifi.inventory.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var inventory = JSON.parse(value);
          var rows = inventory.radios;
          if (!Array.isArray(rows)) throw 'Inventory section radios is absent.';
          return JSON.stringify(rows);
      lld_macro_paths:
      - lld_macro: "{#AP.MAC}"
        path: "$.ap_mac"
      - lld_macro: "{#AP.NAME}"
        path: "$.ap_name"
      - lld_macro: "{#DEVICE.ID}"
        path: "$.device_id"
      - lld_macro: "{#RADIO.BAND}"
        path: "$.radio_band"
      - lld_macro: "{#RADIO.FREQUENCY}"
        path: "$.radio_frequency"
      - lld_macro: "{#SITE.ID}"
        path: "$.site_id"
      - lld_macro: "{#SITE.NAME}"
        path: "$.site_name"
      - lld_macro: "{#HOST.ID}"
        path: "$.host_id"
    tags:
    - tag: class
      value: network
    - tag: target
      value: unifi-site-manager
    macros:
    - macro: "{$UNIFI.API.KEY}"
      type: SECRET_TEXT
      description: API key created in UniFi Site Manager. Never commit a real key.
    - macro: "{$UNIFI.API.URL}"
      value: https://api.ui.com
      description: Official UniFi API base URL.
    - macro: "{$UNIFI.INTERVAL.AVAILABILITY}"
      value: 1m
      description: Critical API, console and application availability collection interval.
    - macro: "{$UNIFI.INTERVAL.STATUS}"
      value: 2m
      description: Operational state collection interval for sites, devices, WANs
        and Protect.
    - macro: "{$UNIFI.INTERVAL.PERFORMANCE}"
      value: 5m
      description: Performance collection interval for statistics, clients, VPNs and
        ISP metrics.
    - macro: "{$UNIFI.INTERVAL.CAPACITY}"
      value: 15m
      description: Capacity collection interval for DHCP and storage-related metrics.
    - macro: "{$UNIFI.INTERVAL.CONFIG}"
      value: 15m
      description: Configuration and security-audit collection interval.
    - macro: "{$UNIFI.INTERVAL.INVENTORY}"
      value: 1h
      description: Unified inventory collection interval shared by all API discovery
        rules.
    - macro: "{$UNIFI.HTTP.TIMEOUT}"
      value: 25s
      description: HTTP Agent timeout. Cloud Connector itself terminates proxied requests
        after 25 seconds.
    - macro: "{$UNIFI.LLD.TIMEOUT}"
      value: 60s
      description: JavaScript LLD timeout. Increase carefully for large multi-console
        accounts.
    - macro: "{$UNIFI.API.NODATA}"
      value: 5m
      description: Maximum interval without a Site Manager API response.
    - macro: "{$UNIFI.DATA.MAX.AGE}"
      value: 30m
      description: Maximum acceptable age for inventory data reported by Site Manager.
    - macro: "{$UNIFI.INVENTORY.NODATA}"
      value: 2h
      description: Maximum interval without a successful unified inventory collection.
    - macro: "{$UNIFI.ISP.DATA.MAX.AGE}"
      value: 15m
      description: Maximum acceptable age of the newest five-minute ISP metric period.
    - macro: "{$UNIFI.BACKUP.MAX.AGE}"
      value: 7d
      description: Maximum acceptable age of a console cloud backup when latestBackupTime
        is available.
    - macro: "{$WAN.LATENCY.WARN}"
      value: '100'
      description: WAN average latency warning threshold in milliseconds.
    - macro: "{$WAN.PACKETLOSS.WARN}"
      value: '5'
      description: WAN packet-loss warning threshold in percent.
    - macro: "{$WAN1.EXPECTED.DL}"
      value: '0'
      description: Expected WAN1 download speed in Mbps. Zero disables the Speedtest
        threshold.
    - macro: "{$WAN1.EXPECTED.UL}"
      value: '0'
      description: Expected WAN1 upload speed in Mbps.
    - macro: "{$WAN2.EXPECTED.DL}"
      value: '0'
      description: Expected WAN2 download speed in Mbps. Zero disables the Speedtest
        threshold.
    - macro: "{$WAN2.EXPECTED.UL}"
      value: '0'
      description: Expected WAN2 upload speed in Mbps.
    - macro: "{$WAN.SPEED.THRESHOLD.PCT}"
      value: '70'
      description: Minimum acceptable internal Speedtest percentage.
    - macro: "{$DHCP.THRESHOLD.PCT}"
      value: '90'
      description: DHCP connected-address utilization threshold.
    - macro: "{$TEMP.MAX.WARN}"
      value: '55'
      description: Maximum acceptable device or disk temperature in degrees Celsius.
    - macro: "{$WIFI.TX.RETRIES.WARN}"
      value: '20'
      description: WiFi transmit-retry warning threshold in percent.
    - macro: "{$PROTECT.SENSOR.BATTERY.MIN}"
      value: '20'
      description: Minimum acceptable Protect sensor battery charge in percent.
    - macro: "{$PROTECT.SENSOR.SIGNAL.MIN}"
      value: '20'
      description: Minimum acceptable fifteen-minute Protect sensor wireless signal
        quality in percent.
    - macro: "{$PROTECT.EVENT.WINDOW}"
      value: 10m
      description: How long a recent Protect leak or tamper event remains in problem
        state.
    - macro: "{$UNIFI.VOUCHER.MONITOR}"
      value: '0'
      description: Enable hotspot voucher alarms. Use a site-name context and value
        1 only where vouchers are operationally required.
    - macro: "{$UNIFI.VOUCHER.AVAILABLE.MIN}"
      value: '10'
      description: Minimum number of non-expired hotspot vouchers with remaining guest
        capacity.
    - macro: "{$UNIFI.VOUCHER.EXPIRES.WARN}"
      value: 24h
      description: Warning window for active hotspot vouchers approaching expiration.
    - macro: "{$UNIFI.VOUCHER.USAGE.EVENT}"
      value: '0'
      description: Enable an informational event whenever total voucher guest authorizations
        increase.
    valuemaps:
    - uuid: 90eaab47a0ca456b8b9aecf7d1dd40ef
      name: UniFi availability
      mappings:
      - value: '0'
        newvalue: Offline/Unavailable
      - value: '1'
        newvalue: Online/Available
      - value: '2'
        newvalue: Unknown
    - uuid: 63f0cdd5f0ff444d83ce88535bfb8b04
      name: Boolean
      mappings:
      - value: '0'
        newvalue: 'No'
      - value: '1'
        newvalue: 'Yes'
    - uuid: 2e471340e7ca44d1873d1b090c7f8d99
      name: UniFi SMART health
      mappings:
      - value: '0'
        newvalue: Healthy
      - value: '1'
        newvalue: Warning
      - value: '2'
        newvalue: Critical
    - uuid: f7873cbc4cab46ac856e4a5869a4d1bb
      name: Protect battery health
      mappings:
      - value: '0'
        newvalue: OK
      - value: '1'
        newvalue: Low
      - value: '2'
        newvalue: Critical
