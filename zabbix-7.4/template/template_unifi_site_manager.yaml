      key: unifi.protect.cameras.discovery
      lifetime_type: DELETE_AFTER
      lifetime: 7d
      enabled_lifetime_type: DISABLE_AFTER
      enabled_lifetime: 1d
      description: Discovers cameras through the official Protect Integration API
        on every console that advertises Protect.
      item_prototypes:
      - uuid: 32890b77308b4ea78eab48347ed417a9
        name: "[{#CAMERA.NAME}] Protect: Camera connection availability"
        type: DEPENDENT
        key: unifi.camera.online[{#CAMERA.ID}]
        history: 30d
        value_type: UNSIGNED
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var payload = JSON.parse(value);
            var rows = Array.isArray(payload.cameras) ? payload.cameras : [];
            var data = null;
            for (var i = 0; i < rows.length; i++) {
                if (String(rows[i].host_id) === '{#HOST.ID}' && rows[i].camera && String(rows[i].camera.id) === '{#CAMERA.ID}') {
                    data = rows[i].camera;
                    break;
                }
            }
            if (!data) throw 'Camera was not found in the consolidated Protect response.';
            return String(data.state || '').toUpperCase() === 'CONNECTED' ? 1 : 0;
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: unifi.protect.status.raw
        tags:
        - tag: component
          value: Camera
        - tag: camera
          value: "{#CAMERA.NAME}"
        - tag: application
          value: Protect
        - tag: site
          value: "{#CAMERA.SITE.ID}"
        trends: 365d
        trigger_prototypes:
        - uuid: d8a660fe61b2452c88abede021b7d8b8
          expression: last(/Template UniFi Site Manager/unifi.camera.online[{#CAMERA.ID}])=0
          name: "[Disaster] Security camera {#CAMERA.NAME} is disconnected"
          priority: DISASTER
          description: Protect reports the camera outside the CONNECTED state. The
