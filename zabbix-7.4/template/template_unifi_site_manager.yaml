    discovery_rules:
    - uuid: 69df451d4cb745a9866bcba0c9cb3311
      name: LLD - UniFi consoles
      type: DEPENDENT
      key: unifi.consoles.discovery
      lifetime_type: DELETE_AFTER
      lifetime: 7d
      enabled_lifetime_type: DISABLE_AFTER
      enabled_lifetime: 1d
      description: Discovers UniFi consoles/hosts and monitors cloud, Network API
        and Protect API reachability.
      item_prototypes:
      - uuid: c79c25c3c05d45aa8375b6b67382db16
        name: "[{#HOST.NAME}] Console: Cloud connection"
        type: DEPENDENT
        key: unifi.console.cloud.state[{#HOST.ID}]
        history: 30d
        value_type: UNSIGNED
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var payload = JSON.parse(value);
            var hosts = Array.isArray(payload.data) ? payload.data : [];
            var id = '{#HOST.ID}';
            for (var i = 0; i < hosts.length; i++) {
                if (String(hosts[i].id) !== id) continue;
                var state = hosts[i].reportedState && hosts[i].reportedState.state;
                if (state) return String(state).toLowerCase() === 'connected' ? 1 : 0;
                var members = hosts[i].userData && Array.isArray(hosts[i].userData.consoleGroupMembers) ? hosts[i].userData.consoleGroupMembers : [];
                if (members.length && members[0].roleAttributes) return String(members[0].roleAttributes.connectedState) === 'CONNECTED' ? 1 : 0;
                return 2;
            }
            throw 'Console was not found in /v1/hosts.';
        master_item:
          key: unifi.sm.hosts.raw
        tags:
        - tag: component
          value: Console
        - tag: console
          value: "{#HOST.NAME}"
        trends: 365d
        trigger_prototypes:
        - uuid: ab918cf4eabb43898514ac4ab8a5407d
          expression: count(/Template UniFi Site Manager/unifi.console.cloud.state[{#HOST.ID}],#2,"eq",0)=2
          name: "[High] UniFi console {#HOST.NAME} is offline for two consecutive
            checks"
          priority: HIGH
          description: The console has reported a disconnected cloud state in two
            consecutive collections. A powered-off UCG/console is detected here. Remote-access
            blocking is monitored separately.
          tags:
          - tag: scope
            value: availability
          - tag: console
            value: "{#HOST.NAME}"
          opdata: 'Host ID: {#HOST.ID}'
        valuemap:
          name: UniFi availability
      - uuid: 38e692d2116b49d28388ee25435b9803
        name: "[{#HOST.NAME}] Console: Remote access blocked"
        type: DEPENDENT
        key: unifi.console.blocked[{#HOST.ID}]
        history: 30d
        value_type: UNSIGNED
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var payload = JSON.parse(value);
            var hosts = Array.isArray(payload.data) ? payload.data : [];
            for (var i = 0; i < hosts.length; i++) if (String(hosts[i].id) === '{#HOST.ID}') return hosts[i].isBlocked ? 1 : 0;
            throw 'Console was not found in /v1/hosts.';
        master_item:
          key: unifi.sm.hosts.raw
        tags:
        - tag: component
          value: Console
        - tag: console
          value: "{#HOST.NAME}"
        trends: 365d
        trigger_prototypes:
        - uuid: 6bb1d02da8c64e928b6b6ada9483ebe6
          expression: last(/Template UniFi Site Manager/unifi.console.blocked[{#HOST.ID}])=1
          name: "[High] UniFi console {#HOST.NAME} has cloud access blocked"
          priority: HIGH
          description: UniFi reports isBlocked=true. Cloud Connector requests cannot
            reach this console.
          tags:
          - tag: scope
            value: availability
          - tag: console
            value: "{#HOST.NAME}"
        valuemap:
          name: Boolean
      - uuid: d6014fb4f71e4dc286ef3414a481962d
        name: "[{#HOST.NAME}] Console: Latest cloud backup age"
        type: DEPENDENT
        key: unifi.console.backup.age[{#HOST.ID}]
        history: 30d
        value_type: UNSIGNED
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var payload = JSON.parse(value);
            var hosts = Array.isArray(payload.data) ? payload.data : [];
            for (var i = 0; i < hosts.length; i++) {
                if (String(hosts[i].id) !== '{#HOST.ID}') continue;
                if (!hosts[i].latestBackupTime) throw 'Latest backup time is not available for this console.';
                var timestamp = Date.parse(hosts[i].latestBackupTime);
                if (isNaN(timestamp)) throw 'Invalid latestBackupTime.';
                return Math.max(0, Math.floor(((new Date()).getTime() - timestamp) / 1000));
            }
            throw 'Console was not found in /v1/hosts.';
        master_item:
          key: unifi.sm.hosts.raw
        tags:
        - tag: component
          value: Backup
        - tag: console
          value: "{#HOST.NAME}"
        trends: 365d
        units: s
        trigger_prototypes:
        - uuid: 70cdaf69239842438c7847dc1ecab123
          expression: last(/Template UniFi Site Manager/unifi.console.backup.age[{#HOST.ID}])>{$UNIFI.BACKUP.MAX.AGE}
          name: "[Average] UniFi console {#HOST.NAME} cloud backup is old"
          priority: AVERAGE
          description: The latestBackupTime reported by Site Manager is older than
            the configured maximum.
          tags:
          - tag: scope
            value: availability
          - tag: console
            value: "{#HOST.NAME}"
          opdata: 'Backup age: {ITEM.LASTVALUE1}'
