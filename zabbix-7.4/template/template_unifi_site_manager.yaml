        history: 30d
        value_type: UNSIGNED
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var payload = JSON.parse(value);
            var sites = Array.isArray(payload.data) ? payload.data : [];
            for (var i = 0; i < sites.length; i++) {
                if (String(sites[i].siteId || sites[i].id) === '{#SITE.ID}') {
