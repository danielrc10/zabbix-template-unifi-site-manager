      - uuid: 70cd45c315774116819a257e0a8fb083
        name: "[{#DISK.MODEL} / {#DISK.SERIAL}] Storage: SMART health"
        type: DEPENDENT
        key: unifi.disk.smart[{#DEVICE.MAC},{#DISK.ID}]
        history: 90d
        value_type: UNSIGNED
        preprocessing:
        - type: JAVASCRIPT
