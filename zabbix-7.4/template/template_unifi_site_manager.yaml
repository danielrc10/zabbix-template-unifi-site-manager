            var payload = JSON.parse(value);
            var rows = Array.isArray(payload.cameras) ? payload.cameras : [];
            var data = null;
            for (var i = 0; i < rows.length; i++) {
                if (String(rows[i].host_id) === '{#HOST.ID}' && rows[i].camera && String(rows[i].camera.id) === '{#CAMERA.ID}') {
                    data = rows[i].camera;
                    break;
                }
            }
