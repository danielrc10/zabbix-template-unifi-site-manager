        history: 30d
        value_type: UNSIGNED
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var data = JSON.parse(value);
            if (data.code || Number(data.httpStatusCode) >= 400) throw String(data.message || data.code);
